name: Feedback & Suggestions
description: Share your feedback, ideas, or feature suggestions for Warhammer Warband.
title: "[Feedback]: "
labels: ["enhancement", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for playing Warhammer Warband! We appreciate your suggestions and feedback to help improve the simulator.
  - type: textarea
    id: feedback
    attributes:
      label: Feedback / Suggestion
      description: What is on your mind? What features or improvements would you like to see?
      placeholder: Describe your ideas or experience here...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which part of the game does this apply to?
      options:
        - Rules Engine & Mathhammer
        - Tournament AI Sparring
        - Army Builder & Factions
        - Mobile / Desktop UX & Controls
        - Physical Tabletop Companion
        - Replay System
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Any screenshots, tournament battle logs, or extra context?
